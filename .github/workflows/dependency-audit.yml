name: Dependency CVE audit

on:
  push:
    paths: ["requirements.txt", ".github/workflows/dependency-audit.yml"]
  pull_request:
    paths: ["requirements.txt"]
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC, to catch newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit requirements.txt (resolves all transitive dependencies)
        run: pip-audit -r requirements.txt --progress-spinner off --desc on
